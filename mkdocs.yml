site_name: microvm
site_description: Boot Linux VMs on Apple Silicon
site_url: https://windsornguyen.github.io/microvm
repo_url: https://github.com/windsornguyen/microvm
repo_name: windsornguyen/microvm
site_author: Windsor Nguyen

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/theme-light-dark
        name: "Theme: auto (click for light)"
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: "Theme: light (click for dark)"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: "Theme: dark (click for auto)"
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - git-revision-date-localized:
      timezone: UTC

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - Usage:
      - Commands: usage/commands.md
      - Snapshots: usage/snapshots.md
      - Nested Virtualization: usage/nested-virt.md
      - Kernel & Rootfs: usage/kernel-rootfs.md
  - Architecture:
      - Overview: architecture/overview.md
  - Contributing: contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/windsornguyen/microvm
    - icon: fontawesome/brands/rust
      link: https://crates.io/crates/microvm

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
